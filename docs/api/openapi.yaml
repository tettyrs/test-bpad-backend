openapi: 3.0.3
info:
  title: KDO Backend API
  version: 1.0.0
  description: REST API pengelolaan Kendaraan Dinas Operasional (KDO), Pegawai, dan Perangkat Daerah.
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Perangkat Daerah
  - name: Pegawai
  - name: Kendaraan Dinas
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mendapatkan Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      token_type: { type: string, example: Bearer }
                      expires_in: { type: integer, example: 86400 }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Data user yang sedang login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan mencabut token saat ini
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string, example: Logout berhasil. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /perangkat-daerah:
    get:
      tags: [Perangkat Daerah]
      summary: Daftar perangkat daerah (paginated)
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPerangkatDaerah'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Perangkat Daerah]
      summary: Tambah perangkat daerah
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerangkatDaerahInput'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PerangkatDaerah' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /perangkat-daerah/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Perangkat Daerah]
      summary: Detail perangkat daerah
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PerangkatDaerah' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Perangkat Daerah]
      summary: Ubah perangkat daerah (sebagian atau seluruh field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerangkatDaerahPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PerangkatDaerah' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Perangkat Daerah]
      summary: Hapus perangkat daerah (soft delete)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pegawai:
    get:
      tags: [Pegawai]
      summary: Daftar pegawai (paginated)
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPegawai'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Pegawai]
      summary: Tambah pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PegawaiInput'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pegawai' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /pegawai/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pegawai]
      summary: Detail pegawai
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pegawai' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pegawai]
      summary: Ubah pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PegawaiPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pegawai' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pegawai]
      summary: Hapus pegawai (soft delete)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pegawai/{id}/akun:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Pegawai]
      summary: Buat akun login untuk pegawai
      description: Membuat user baru dari email dan password, lalu menghubungkannya ke pegawai. Hanya admin yang boleh memanggil endpoint ini. Satu pegawai hanya punya satu akun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PegawaiAkunInput'
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pegawai_id: { type: integer }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Peran bukan admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: Hanya admin yang boleh melakukan aksi ini.
                  details: null
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Pegawai sudah memiliki akun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Pegawai ini sudah memiliki akun.
                  details: null
        '422': { $ref: '#/components/responses/ValidationError' }

  /kendaraan-dinas:
    get:
      tags: [Kendaraan Dinas]
      summary: Daftar kendaraan dinas (paginated, bisa difilter kondisi)
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
        - name: kondisi
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Kondisi'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKendaraanDinas'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Kendaraan Dinas]
      summary: Tambah kendaraan dinas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KendaraanDinasInput'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KendaraanDinas' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /kendaraan-dinas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Kendaraan Dinas]
      summary: Detail kendaraan dinas (beserta perangkat daerah dan pegawai)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KendaraanDinas' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Kendaraan Dinas]
      summary: Ubah kendaraan dinas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KendaraanDinasPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KendaraanDinas' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Kendaraan Dinas]
      summary: Hapus kendaraan dinas (soft delete)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      tags: [Pengguna]
      summary: Daftar pengguna (paginated)
      description: Khusus admin.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
        - name: role
          in: query
          schema: { type: string, enum: [admin, operator] }
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna]
      summary: Tambah pengguna
      description: Khusus admin. Pengguna baru langsung aktif. Tidak wajib terhubung ke pegawai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pengguna]
      summary: Detail pengguna
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna]
      summary: Ubah nama, email, atau peran pengguna
      description: Khusus admin. Admin tidak bisa mengubah peran akunnya sendiri, dan minimal harus tersisa satu admin aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Pengguna]
      summary: Aktifkan atau nonaktifkan pengguna
      description: Khusus admin. Saat dinonaktifkan, semua token pengguna dicabut dan akun tidak bisa login. Admin tidak bisa menonaktifkan akunnya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Pengguna]
      summary: Reset password pengguna
      description: Khusus admin. Password baru langsung berlaku, dan semua token lama pengguna dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, minLength: 8, maxLength: 255 }
                password_confirmation: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Search:
      name: search
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  schemas:
    Kondisi:
      type: string
      enum: [baik, rusak_ringan, rusak_berat]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, operator], description: Admin dapat mengelola pengguna dan membuat akun pegawai. Operator hanya dapat mengelola data. }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserInput:
      type: object
      required: [name, email, password, password_confirmation, role]
      properties:
        name: { type: string, maxLength: 255, example: Dewi Lestari }
        email: { type: string, format: email, maxLength: 255, description: Disimpan dalam huruf kecil }
        password: { type: string, minLength: 8, maxLength: 255 }
        password_confirmation: { type: string, minLength: 8, maxLength: 255 }
        role: { type: string, enum: [admin, operator] }

    UserPatch:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, operator] }

    PaginatedUsers:
      $ref: '#/components/schemas/Paginated'

    PerangkatDaerahInput:
      type: object
      required: [kode_pd, nama]
      properties:
        kode_pd: { type: string, maxLength: 20, example: PD-001 }
        nama: { type: string, maxLength: 255, example: Dinas Pendidikan }
        alamat: { type: string, maxLength: 1000, nullable: true }
    PerangkatDaerahPatch:
      type: object
      properties:
        kode_pd: { type: string, maxLength: 20 }
        nama: { type: string, maxLength: 255 }
        alamat: { type: string, maxLength: 1000, nullable: true }
    PerangkatDaerah:
      type: object
      properties:
        id: { type: integer }
        kode_pd: { type: string }
        nama: { type: string }
        alamat: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedPerangkatDaerah:
      $ref: '#/components/schemas/Paginated'

    PegawaiInput:
      type: object
      required: [nama, nip, jabatan, golongan]
      properties:
        nama: { type: string, maxLength: 255 }
        nip: { type: string, maxLength: 30, example: '198501012010011001' }
        jabatan: { type: string, maxLength: 255 }
        golongan: { type: string, maxLength: 20, example: III/a }
    PegawaiPatch:
      type: object
      properties:
        nama: { type: string, maxLength: 255 }
        nip: { type: string, maxLength: 30 }
        jabatan: { type: string, maxLength: 255 }
        golongan: { type: string, maxLength: 20 }
    Pegawai:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true, description: ID akun login pegawai, null jika belum punya akun }
        nama: { type: string }
        nip: { type: string }
        jabatan: { type: string }
        golongan: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedPegawai:
      $ref: '#/components/schemas/Paginated'

    PegawaiAkunInput:
      type: object
      required: [email, password, password_confirmation]
      properties:
        email: { type: string, format: email, maxLength: 255, example: siti.rahayu@example.com }
        password: { type: string, minLength: 8, example: rahasia123 }
        password_confirmation: { type: string, minLength: 8, example: rahasia123, description: Harus sama dengan password }

    KendaraanDinasInput:
      type: object
      required: [nomor_polisi, merk_kendaraan, tahun_produksi, warna_kendaraan, kondisi, perangkat_daerah_id]
      properties:
        nomor_polisi:
          type: string
          maxLength: 20
          pattern: '^[A-Z]{1,2} ?\d{1,4} ?[A-Z]{0,3}$'
          example: B 1234 ABC
          description: Dinormalisasi ke huruf besar dan spasi tunggal sebelum validasi. Harus unik.
        merk_kendaraan: { type: string, maxLength: 100, example: Toyota }
        tipe_kendaraan: { type: string, maxLength: 100, nullable: true, example: Avanza G }
        tahun_produksi: { type: integer, minimum: 1950, description: 'Maksimal tahun berjalan + 1' }
        warna_kendaraan: { type: string, maxLength: 50, example: Hitam }
        kondisi: { $ref: '#/components/schemas/Kondisi' }
        perangkat_daerah_id: { type: integer, description: 'ID perangkat daerah yang ada' }
        pegawai_id: { type: integer, nullable: true, description: 'ID pegawai penanggung jawab' }
    KendaraanDinasPatch:
      type: object
      properties:
        nomor_polisi: { type: string, maxLength: 20, pattern: '^[A-Z]{1,2} ?\d{1,4} ?[A-Z]{0,3}$' }
        merk_kendaraan: { type: string, maxLength: 100 }
        tipe_kendaraan: { type: string, maxLength: 100, nullable: true }
        tahun_produksi: { type: integer, minimum: 1950 }
        warna_kendaraan: { type: string, maxLength: 50 }
        kondisi: { $ref: '#/components/schemas/Kondisi' }
        perangkat_daerah_id: { type: integer }
        pegawai_id: { type: integer, nullable: true }
    KendaraanDinas:
      type: object
      properties:
        id: { type: integer }
        nomor_polisi: { type: string }
        merk_kendaraan: { type: string }
        tipe_kendaraan: { type: string, nullable: true }
        tahun_produksi: { type: integer }
        warna_kendaraan: { type: string }
        kondisi: { $ref: '#/components/schemas/Kondisi' }
        perangkat_daerah:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PerangkatDaerah'
        pegawai:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Pegawai'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedKendaraanDinas:
      $ref: '#/components/schemas/Paginated'

    Deleted:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
            deleted: { type: boolean, example: true }

    Paginated:
      type: object
      properties:
        data:
          type: array
          items: { type: object }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - RESOURCE_NOT_FOUND
                - ENDPOINT_NOT_FOUND
                - METHOD_NOT_ALLOWED
                - TOO_MANY_REQUESTS
                - CONFLICT
                - INTERNAL_ERROR
            message: { type: string }
            details:
              nullable: true
              description: Berisi daftar error per field untuk VALIDATION_ERROR. Terisi hanya jika APP_DEBUG=true untuk INTERNAL_ERROR.

  responses:
    Forbidden:
      description: Peran tidak punya izin untuk aksi ini (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Hanya admin yang boleh melakukan aksi ini.
              details: null
    Conflict:
      description: Aksi bentrok dengan aturan yang berlaku (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: Minimal harus ada satu admin yang aktif.
              details: null
    ValidationError:
      description: Data tidak valid (422)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            example:
              error:
                code: VALIDATION_ERROR
                message: Data yang dikirim tidak valid.
                details:
                  nomor_polisi: ['The nomor polisi field is required.']
    Unauthenticated:
      description: Token tidak ada, salah, atau sudah dicabut (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Token tidak valid atau belum login.
              details: null
    InvalidCredentials:
      description: Email atau password salah (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Data yang diminta tidak ditemukan.
              details: null
    TooManyRequests:
      description: Terlalu banyak permintaan (429)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
